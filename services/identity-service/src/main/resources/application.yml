spring:
  application:
    name: identity-service
  datasource:
    url: jdbc:postgresql://localhost:5432/omniorder
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:default}

server:
  port: 8081

# JWT RS256 configuration
jwt:
  issuer: ${JWT_ISSUER:identity-service}
  private-key-pem: ${JWT_PRIVATE_KEY_PEM}
  public-key-pem: ${JWT_PUBLIC_KEY_PEM}
  expiration-seconds: ${JWT_EXPIRATION_SECONDS:86400}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
