services:
  postgres:
    image: postgres:15.4
    container_name: omniorder-postgres
    environment:
      POSTGRES_DB: omniorder
      POSTGRES_USER: ${OMNIORDER_DB_USERNAME:?Set OMNIORDER_DB_USERNAME}
      POSTGRES_PASSWORD: ${OMNIORDER_DB_PASSWORD:?Set OMNIORDER_DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - omniorder_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omniorder -d omniorder"]
      interval: 5s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:7.0
    container_name: omniorder-mongodb
    ports:
      - "27017:27017"
    volumes:
      - omniorder_mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.runCommand({ping:1})"]
      interval: 5s
      timeout: 5s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: omniorder-zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: omniorder-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: omniorder-redis
    ports:
      - "6379:6379"

  identity-service:
    build:
      context: .
      dockerfile: services/identity-service/Dockerfile
    container_name: omniorder-identity
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/omniorder
      SPRING_DATASOURCE_USERNAME: ${OMNIORDER_DB_USERNAME:?Set OMNIORDER_DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${OMNIORDER_DB_PASSWORD:?Set OMNIORDER_DB_PASSWORD}
      JWT_PRIVATE_KEY_PEM: ${JWT_PRIVATE_KEY_PEM:?Set a secret-managed file location}
      JWT_PUBLIC_KEY_PEM: ${JWT_PUBLIC_KEY_PEM:?Set a secret-managed file location}
    restart: unless-stopped

  order-service:
    build:
      context: .
      dockerfile: services/order-service/Dockerfile
    container_name: omniorder-order
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/omniorder
      SPRING_DATASOURCE_USERNAME: ${OMNIORDER_DB_USERNAME:?Set OMNIORDER_DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${OMNIORDER_DB_PASSWORD:?Set OMNIORDER_DB_PASSWORD}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      APP_GRPC_INVENTORY_HOST: inventory-service
      APP_GRPC_INVENTORY_PORT: 9090
    restart: unless-stopped

  inventory-service:
    build:
      context: .
      dockerfile: services/inventory-service/Dockerfile
    container_name: omniorder-inventory
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "8083:8083"
      - "9090:9090"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/omniorder
      SPRING_DATASOURCE_USERNAME: ${OMNIORDER_DB_USERNAME:?Set OMNIORDER_DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${OMNIORDER_DB_PASSWORD:?Set OMNIORDER_DB_PASSWORD}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_GRPC_SERVER_PORT: 9090
    restart: unless-stopped

  gateway:
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    container_name: omniorder-gateway
    depends_on:
      - identity-service
      - order-service
      - inventory-service
      - redis
    ports:
      - "8080:8080"
    environment:
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
    restart: unless-stopped

  notification-worker:
    build:
      context: .
      dockerfile: services/notification-worker/Dockerfile
    container_name: omniorder-notification
    depends_on:
      - kafka
    ports:
      - "8084:8084"
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    restart: unless-stopped

  audit-worker:
    build:
      context: .
      dockerfile: services/audit-worker/Dockerfile
    container_name: omniorder-audit
    depends_on:
      - kafka
      - mongodb
    ports:
      - "8085:8085"
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_DATA_MONGODB_URI: mongodb://mongodb:27017/omniorder_audit
    restart: unless-stopped

volumes:
  omniorder_postgres_data:
  omniorder_mongo_data:
