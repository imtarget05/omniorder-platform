              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: audit-worker
  namespace: omniorder
  labels:
    app: audit-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: audit-worker
  template:
    metadata:
      labels:
        app: audit-worker
    spec:
      containers:
        - name: audit-worker
          image: omniorder/audit-worker:latest
          env:
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              value: kafka.omniorder.svc.cluster.local:9092
