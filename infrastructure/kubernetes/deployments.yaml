              value: mongodb://mongodb.omniorder.svc.cluster.local:27017/omniorder_audit
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"

---
apiVersion: v1
kind: Service
metadata:
  name: identity-service
  namespace: omniorder
spec:
  selector:
    app: identity-service
  ports:
    - protocol: TCP
      port: 8081
      targetPort: 8081

---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: omniorder
spec:
  selector:
    app: order-service
  ports:
    - protocol: TCP
      port: 8082
      targetPort: 8082

---
apiVersion: v1
kind: Service
metadata:
  name: inventory-service
  namespace: omniorder
spec:
  selector:
    app: inventory-service
  ports:
    - protocol: TCP
      port: 8083
      targetPort: 8083
    - protocol: TCP
      port: 9090
      targetPort: 9090
      name: grpc

---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: omniorder
spec:
  selector:
    app: gateway
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
