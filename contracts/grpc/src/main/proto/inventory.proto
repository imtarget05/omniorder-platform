syntax = "proto3";

package inventory;

option java_package = "com.omniorder.contracts.grpc.inventory";
option java_multiple_files = true;
option java_outer_classname = "InventoryProto";

service InventoryService {
  // Lấy thông tin sản phẩm theo SKU (read-only reference, không dùng để giữ hàng)
  rpc GetProduct(GetProductRequest) returns (GetProductResponse);
  // Kiểm tra tồn kho tham khảo (không bắt đầu transaction giữ hàng)
  rpc CheckStockReference(CheckStockReferenceRequest) returns (CheckStockReferenceResponse);
}

message GetProductRequest {
  string sku = 1;
}

message GetProductResponse {
  string product_id = 1;
  string sku = 2;
  string name = 3;
  double price = 4;
  int32 available_stock = 5;
  bool exists = 6;
}

message CheckStockReferenceRequest {
  string product_id = 1;
  int32 requested_quantity = 2;
}

message CheckStockReferenceResponse {
  string product_id = 1;
  int32 available_stock = 2;
  bool sufficient = 3;
}
